<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Barbería - Acceso</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F1E8DB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #F8F1E5 0%, #EDDFC9 45%, #E1CBA8 100%);
    background-attachment: fixed;
    color: #4A3A2A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .card {
    background: #FFFDF8;
    border-radius: 22px;
    padding: 32px 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 24px 50px rgba(90,65,40,0.18), 0 2px 8px rgba(90,65,40,0.08);
    border: 1px solid rgba(216,200,181,0.5);
    animation: fadeSlideUp 0.5s ease;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
    color: #3A2A1A;
    letter-spacing: 0.01em;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #9C8468;
    margin-bottom: 24px;
  }
  .tabs {
    display: flex;
    background: #F1E8DB;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 24px;
    border: 1px solid rgba(216,200,181,0.6);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    color: #9C8468;
    transition: all 0.25s ease;
    user-select: none;
  }
  .tab.active {
    background: linear-gradient(180deg, #C89A5A, #A8783D);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 3px 10px rgba(157,111,57,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .field {
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #9C8468;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #D8C8B5;
    background: #FCFAF7;
    color: #3A2A1A;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input:focus {
    border-color: #B6864A;
    box-shadow: 0 0 0 4px rgba(182,134,74,0.15);
  }
  button.submit {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(180deg, #C89A5A, #A8783D);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 4px 12px rgba(157,111,57,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  }
  button.submit:hover { background: linear-gradient(180deg, #D0A365, #B27E43); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(157,111,57,0.38), inset 0 1px 0 rgba(255,255,255,0.25); }
  button.submit:active { transform: translateY(0); }
  button.submit:disabled { background: #C4AC8C; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-logout-inline {
    width: 100%;
    padding: 10px;
    border: none;
    background: transparent;
    color: #8A7662;
    font-size: 12px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-logout-inline:hover { color: #9C8468; text-decoration: underline; }

  .olvido-password {
    text-align: center;
    font-size: 12px;
    color: #8A7662;
    cursor: pointer;
    margin-top: 14px;
  }
  .olvido-password:hover { color: #9C8468; text-decoration: underline; }

  /* ---- Modal personalizado (sustituye al prompt nativo) ---- */
  @keyframes modalPop { from { opacity: 0; transform: scale(0.95) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-overlay-custom {
    position: fixed;
    inset: 0;
    background: rgba(74,58,42,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-caja-custom {
    background: #FFFDF8;
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 24px 50px rgba(90,65,40,0.28);
    border: 1px solid rgba(216,200,181,0.5);
    animation: modalPop 0.25s ease;
  }
  .modal-mensaje-custom {
    font-size: 14px;
    color: #3A2A1A;
    line-height: 1.5;
    margin-bottom: 14px;
  }
  .modal-input-custom {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid #D8C8B5;
    background: #FCFAF7;
    color: #3A2A1A;
    font-size: 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .modal-input-custom:focus { border-color: #B6864A; box-shadow: 0 0 0 4px rgba(182,134,74,0.15); }
  .modal-botones-custom { display: flex; gap: 8px; }
  .modal-botones-custom button { margin-top: 0; flex: 1; }

  .admin-link {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #8A7662;
    cursor: pointer;
  }
  .admin-link:hover { color: #9C8468; }

  .msg {
    font-size: 13px;
    text-align: center;
    margin-top: 14px;
    min-height: 18px;
  }
  .msg.error { color: #C4634B; }
  .msg.success { color: #7CB88C; }

  .hidden { display: none !important; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <h1 id="titulo">✂ Barbería</h1>
  <div class="subtitle" id="subtitulo">Reserva tu cita en segundos</div>

  <!-- Aviso de sesión ya iniciada -->
  <div class="card" id="avisoSesion" style="background:#F1E8DB; border:1px solid #D8C8B5; padding:16px; margin-bottom:18px; display:none;">
    <div style="font-size:13px; color:#9C8468; margin-bottom:12px;">
      Ya tienes una sesión iniciada como <strong id="avisoSesionEmail" style="color:#3A2A1A;"></strong>
    </div>
    <button type="button" class="submit" id="btnContinuarSesion" style="margin-top:0;">Continuar</button>
    <button type="button" class="btn-logout-inline" id="btnCerrarSesionAviso">Cerrar sesión y usar otra cuenta</button>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="login">Entrar</div>
    <div class="tab" data-tab="registro">Registrarme</div>
  </div>

  <!-- LOGIN -->
  <form id="formLogin">
    <div class="field">
      <label for="loginEmail">Correo electrónico</label>
      <input type="email" id="loginEmail" placeholder="maria@email.com" required autocomplete="username">
    </div>
    <div class="field">
      <label for="loginPassword">Contraseña</label>
      <input type="password" id="loginPassword" placeholder="Introduce tu contraseña" required autocomplete="current-password">
    </div>
    <button type="submit" class="submit" id="btnLogin">Entrar</button>
    <div class="olvido-password" id="btnOlvidoPassword">¿Has olvidado tu contraseña?</div>
  </form>

  <!-- REGISTRO -->
  <form id="formRegistro" class="hidden">
    <div class="field">
      <label for="regNombre">Nombre completo</label>
      <input type="text" id="regNombre" placeholder="Ej: María García" required autocomplete="name">
    </div>
    <div class="field">
      <label for="regTelefono">Teléfono de contacto</label>
      <input type="tel" id="regTelefono" placeholder="Ej: 600123456" required autocomplete="tel">
    </div>
    <div class="field">
      <label for="regEmail">Correo electrónico (será tu usuario)</label>
      <input type="email" id="regEmail" placeholder="Ej: maria@email.com" required autocomplete="email">
    </div>
    <div class="field">
      <label for="regPassword">Contraseña</label>
      <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
    </div>
    <button type="submit" class="submit" id="btnRegistro">Crear cuenta</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="admin-link" id="adminLink">Acceso profesional →</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
// Configuración real del proyecto Firebase "e-barberia"
const firebaseConfig = {
  apiKey: "AIzaSyB3ejavlHCtOFO8G1eriLq6lk5LxJpVUNA",
  authDomain: "e-barberialpa.firebaseapp.com",
  databaseURL: "https://e-barberialpa-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "e-barberialpa",
  storageBucket: "e-barberialpa.firebasestorage.app",
  messagingSenderId: "550304925693",
  appId: "1:550304925693:web:34b21785193d1cfe387b94"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// Mantener sesión iniciada entre visitas (persistencia en el propio almacenamiento del navegador)
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
// Los correos automáticos de Firebase (recuperación de contraseña, etc.) se envían en español
auth.languageCode = "es";

const CLAVE_ULTIMO_EMAIL = "peluqueria_lastEmail";

// ---------- Helpers ----------
function limpiarTelefono(tel) {
  return tel.replace(/\s|\+|-/g, "");
}

function mostrarMensaje(texto, tipo) {
  const msg = document.getElementById("msg");
  msg.textContent = texto;
  msg.className = "msg " + (tipo || "");
}

function setCargando(boton, cargando, textoNormal) {
  boton.disabled = cargando;
  boton.innerHTML = cargando ? '<span class="spinner"></span>Procesando...' : textoNormal;
}

// ---------- Tabs ----------
const tabs = document.querySelectorAll(".tab");
const formLogin = document.getElementById("formLogin");
const formRegistro = document.getElementById("formRegistro");

// Rellenar el email si ya se usó antes en este dispositivo
const ultimoEmail = localStorage.getItem(CLAVE_ULTIMO_EMAIL);
if (ultimoEmail) {
  document.getElementById("loginEmail").value = ultimoEmail;
}

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    mostrarMensaje("");
    if (tab.dataset.tab === "login") {
      formLogin.classList.remove("hidden");
      formRegistro.classList.add("hidden");
    } else {
      formLogin.classList.add("hidden");
      formRegistro.classList.remove("hidden");
    }
  });
});

// ---------- Modo admin ----------
let modoAdmin = false;
const adminLink = document.getElementById("adminLink");

adminLink.addEventListener("click", () => {
  modoAdmin = !modoAdmin;
  document.getElementById("tabs").classList.toggle("hidden", modoAdmin);
  formRegistro.classList.add("hidden");
  formLogin.classList.remove("hidden");
  if (modoAdmin) {
    document.getElementById("titulo").textContent = "🔑 Acceso profesional";
    document.getElementById("subtitulo").textContent = "Panel de administración";
    adminLink.textContent = "← Volver a acceso cliente";
  } else {
    document.getElementById("titulo").textContent = "✂ Barbería";
    document.getElementById("subtitulo").textContent = "Reserva tu cita en segundos";
    adminLink.textContent = "Acceso profesional →";
  }
  mostrarMensaje("");
});

// ---------- Modal personalizado tipo "prompt" (sustituye al prompt nativo) ----------
function mostrarPrompt(mensaje, valorInicial) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay-custom";
    overlay.innerHTML = `
      <div class="modal-caja-custom">
        <div class="modal-mensaje-custom">${mensaje}</div>
        <input type="email" id="mpInput" class="modal-input-custom" placeholder="tu@email.com" value="${valorInicial || ''}">
        <div class="modal-botones-custom">
          <button class="submit" id="mpCancelar" style="background:transparent; border:1px solid #C4AC8C; color:#9C8468;">Cancelar</button>
          <button class="submit" id="mpOk">Enviar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector("#mpInput");
    input.focus();
    const cerrar = (valor) => { overlay.remove(); resolve(valor); };
    overlay.querySelector("#mpCancelar").addEventListener("click", () => cerrar(null));
    overlay.querySelector("#mpOk").addEventListener("click", () => cerrar(input.value.trim() || null));
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") cerrar(input.value.trim() || null); });
    overlay.addEventListener("click", (e) => { if (e.target === overlay) cerrar(null); });
  });
}

// ---------- Recuperar contraseña ----------
document.getElementById("btnOlvidoPassword").addEventListener("click", async () => {
  const emailField = document.getElementById("loginEmail");
  let email = emailField.value.trim();

  if (!email) {
    email = await mostrarPrompt("Escribe el correo con el que te registraste para enviarte el enlace de recuperación:");
    if (!email) return;
    email = email.trim();
  }

  try {
    await auth.sendPasswordResetEmail(email);
    mostrarMensaje("Te hemos enviado un correo a " + email + " con un enlace para restablecer tu contraseña. Revisa también tu bandeja de No deseados / Spam.", "success");
  } catch (err) {
    mostrarMensaje(traducirError(err.code), "error");
  }
});

// ---------- Login ----------
formLogin.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnLogin");
  mostrarMensaje("");

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  setCargando(btn, true, "Entrar");
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    localStorage.setItem(CLAVE_ULTIMO_EMAIL, email);

    if (modoAdmin) {
      // Verificar que el usuario tiene rol admin en la base de datos
      const snap = await db.ref("admins/" + uid).get();
      if (!snap.exists()) {
        await auth.signOut();
        mostrarMensaje("Esta cuenta no tiene permisos de administrador.", "error");
        setCargando(btn, false, "Entrar");
        return;
      }
      window.location.href = "admin.html";
    } else {
      window.location.href = "reservar.html";
    }
  } catch (err) {
    mostrarMensaje(traducirError(err.code), "error");
  }
  setCargando(btn, false, "Entrar");
});

// ---------- Registro ----------
formRegistro.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnRegistro");
  mostrarMensaje("");

  const nombre = document.getElementById("regNombre").value.trim();
  const telefono = limpiarTelefono(document.getElementById("regTelefono").value.trim());
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;

  setCargando(btn, true, "Crear cuenta");
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;

    await db.ref("clientes/" + uid).set({
      nombre: nombre,
      telefono: telefono,
      email: email,
      noShows: 0,
      citasCompletadas: 0,
      creadaEn: Date.now()
    });

    localStorage.setItem(CLAVE_ULTIMO_EMAIL, email);
    mostrarMensaje("Cuenta creada correctamente. Redirigiendo...", "success");
    setTimeout(() => { window.location.href = "reservar.html"; }, 1000);
  } catch (err) {
    mostrarMensaje(traducirError(err.code), "error");
    setCargando(btn, false, "Crear cuenta");
  }
});

// ---------- Traducción de errores comunes de Firebase ----------
function traducirError(code) {
  const errores = {
    "auth/email-already-in-use": "Ese correo ya está registrado. Prueba a iniciar sesión.",
    "auth/invalid-email": "El correo introducido no es válido.",
    "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
    "auth/user-not-found": "No existe ninguna cuenta con ese correo.",
    "auth/wrong-password": "Contraseña incorrecta.",
    "auth/invalid-credential": "Correo o contraseña incorrectos.",
    "auth/too-many-requests": "Demasiados intentos. Inténtalo de nuevo en unos minutos."
  };
  return errores[code] || "Ha ocurrido un error. Inténtalo de nuevo.";
}

// ---------- Si ya hay sesión iniciada, mostrar aviso en vez de redirigir sola ----------
let destinoSiContinua = "reservar.html";

auth.onAuthStateChanged(async (user) => {
  const aviso = document.getElementById("avisoSesion");
  if (!user) {
    aviso.style.display = "none";
    return;
  }

  const snapAdmin = await db.ref("admins/" + user.uid).get();
  destinoSiContinua = snapAdmin.exists() ? "admin.html" : "reservar.html";

  document.getElementById("avisoSesionEmail").textContent = user.email;
  aviso.style.display = "block";
});

document.getElementById("btnContinuarSesion").addEventListener("click", () => {
  window.location.href = destinoSiContinua;
});

document.getElementById("btnCerrarSesionAviso").addEventListener("click", async () => {
  await auth.signOut();
  document.getElementById("avisoSesion").style.display = "none";
});
</script>
</body>
</html>
