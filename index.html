<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Peluquería - Acceso</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e293b">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1e293b;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #273549;
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 22px;
    text-align: center;
    margin-bottom: 4px;
    color: #f1f5f9;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 24px;
  }
  .tabs {
    display: flex;
    background: #1e293b;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: #94a3b8;
    transition: all 0.2s;
    user-select: none;
  }
  .tab.active {
    background: #3b82f6;
    color: #fff;
    font-weight: 600;
  }
  .field {
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #f1f5f9;
    font-size: 15px;
    outline: none;
  }
  input:focus {
    border-color: #3b82f6;
  }
  button.submit {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }
  button.submit:hover { background: #2563eb; }
  button.submit:disabled { background: #475569; cursor: not-allowed; }

  .admin-link {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #64748b;
    cursor: pointer;
  }
  .admin-link:hover { color: #94a3b8; }

  .msg {
    font-size: 13px;
    text-align: center;
    margin-top: 14px;
    min-height: 18px;
  }
  .msg.error { color: #f87171; }
  .msg.success { color: #4ade80; }

  .hidden { display: none !important; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <h1 id="titulo">💈 Peluquería</h1>
  <div class="subtitle" id="subtitulo">Reserva tu cita en segundos</div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="login">Entrar</div>
    <div class="tab" data-tab="registro">Registrarme</div>
  </div>

  <!-- LOGIN -->
  <form id="formLogin">
    <div class="field">
      <label for="loginEmail">Correo electrónico</label>
      <input type="email" id="loginEmail" placeholder="maria@email.com" required autocomplete="username">
    </div>
    <div class="field">
      <label for="loginPassword">Contraseña</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="submit" id="btnLogin">Entrar</button>
  </form>

  <!-- REGISTRO -->
  <form id="formRegistro" class="hidden">
    <div class="field">
      <label for="regNombre">Nombre completo</label>
      <input type="text" id="regNombre" placeholder="María García" required autocomplete="name">
    </div>
    <div class="field">
      <label for="regTelefono">Teléfono de contacto</label>
      <input type="tel" id="regTelefono" placeholder="600123456" required autocomplete="tel">
    </div>
    <div class="field">
      <label for="regEmail">Correo electrónico (será tu usuario)</label>
      <input type="email" id="regEmail" placeholder="maria@email.com" required autocomplete="email">
    </div>
    <div class="field">
      <label for="regPassword">Contraseña</label>
      <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
    </div>
    <button type="submit" class="submit" id="btnRegistro">Crear cuenta</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="admin-link" id="adminLink">Acceso profesional →</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
// ⚠️ Sustituir con la config real del proyecto Firebase nuevo
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyB3ejavlHCtOFO8G1eriLq6lk5LxJpVUNA",
  authDomain: "e-barberialpa.firebaseapp.com",
  databaseURL: "https://e-barberialpa-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "e-barberialpa",
  storageBucket: "e-barberialpa.firebasestorage.app",
  messagingSenderId: "550304925693",
  appId: "1:550304925693:web:34b21785193d1cfe387b94"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// Mantener sesión iniciada entre visitas (persistencia en el propio almacenamiento del navegador)
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const CLAVE_ULTIMO_EMAIL = "peluqueria_lastEmail";

// ---------- Helpers ----------
function limpiarTelefono(tel) {
  return tel.replace(/\s|\+|-/g, "");
}

function mostrarMensaje(texto, tipo) {
  const msg = document.getElementById("msg");
  msg.textContent = texto;
  msg.className = "msg " + (tipo || "");
}

function setCargando(boton, cargando, textoNormal) {
  boton.disabled = cargando;
  boton.innerHTML = cargando ? '<span class="spinner"></span>Procesando...' : textoNormal;
}

// ---------- Tabs ----------
const tabs = document.querySelectorAll(".tab");
const formLogin = document.getElementById("formLogin");
const formRegistro = document.getElementById("formRegistro");

// Rellenar el email si ya se usó antes en este dispositivo
const ultimoEmail = localStorage.getItem(CLAVE_ULTIMO_EMAIL);
if (ultimoEmail) {
  document.getElementById("loginEmail").value = ultimoEmail;
}

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    mostrarMensaje("");
    if (tab.dataset.tab === "login") {
      formLogin.classList.remove("hidden");
      formRegistro.classList.add("hidden");
    } else {
      formLogin.classList.add("hidden");
      formRegistro.classList.remove("hidden");
    }
  });
});

// ---------- Modo admin ----------
let modoAdmin = false;
const adminLink = document.getElementById("adminLink");

adminLink.addEventListener("click", () => {
  modoAdmin = !modoAdmin;
  document.getElementById("tabs").classList.toggle("hidden", modoAdmin);
  formRegistro.classList.add("hidden");
  formLogin.classList.remove("hidden");
  if (modoAdmin) {
    document.getElementById("titulo").textContent = "🔑 Acceso profesional";
    document.getElementById("subtitulo").textContent = "Panel de administración";
    adminLink.textContent = "← Volver a acceso cliente";
  } else {
    document.getElementById("titulo").textContent = "💈 Peluquería";
    document.getElementById("subtitulo").textContent = "Reserva tu cita en segundos";
    adminLink.textContent = "Acceso profesional →";
  }
  mostrarMensaje("");
});

// ---------- Login ----------
formLogin.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnLogin");
  mostrarMensaje("");

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  setCargando(btn, true, "Entrar");
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    localStorage.setItem(CLAVE_ULTIMO_EMAIL, email);

    if (modoAdmin) {
      // Verificar que el usuario tiene rol admin en la base de datos
      const snap = await db.ref("admins/" + uid).get();
      if (!snap.exists()) {
        await auth.signOut();
        mostrarMensaje("Esta cuenta no tiene permisos de administrador.", "error");
        setCargando(btn, false, "Entrar");
        return;
      }
      window.location.href = "admin.html";
    } else {
      window.location.href = "reservar.html";
    }
  } catch (err) {
    mostrarMensaje(traducirError(err.code), "error");
  }
  setCargando(btn, false, "Entrar");
});

// ---------- Registro ----------
formRegistro.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnRegistro");
  mostrarMensaje("");

  const nombre = document.getElementById("regNombre").value.trim();
  const telefono = limpiarTelefono(document.getElementById("regTelefono").value.trim());
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;

  setCargando(btn, true, "Crear cuenta");
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;

    await db.ref("clientes/" + uid).set({
      nombre: nombre,
      telefono: telefono,
      email: email,
      noShows: 0,
      citasCompletadas: 0,
      creadaEn: Date.now()
    });

    localStorage.setItem(CLAVE_ULTIMO_EMAIL, email);
    mostrarMensaje("Cuenta creada correctamente. Redirigiendo...", "success");
    setTimeout(() => { window.location.href = "reservar.html"; }, 1000);
  } catch (err) {
    mostrarMensaje(traducirError(err.code), "error");
    setCargando(btn, false, "Crear cuenta");
  }
});

// ---------- Traducción de errores comunes de Firebase ----------
function traducirError(code) {
  const errores = {
    "auth/email-already-in-use": "Ese correo ya está registrado. Prueba a iniciar sesión.",
    "auth/invalid-email": "El correo introducido no es válido.",
    "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
    "auth/user-not-found": "No existe ninguna cuenta con ese correo.",
    "auth/wrong-password": "Contraseña incorrecta.",
    "auth/invalid-credential": "Correo o contraseña incorrectos.",
    "auth/too-many-requests": "Demasiados intentos. Inténtalo de nuevo en unos minutos."
  };
  return errores[code] || "Ha ocurrido un error. Inténtalo de nuevo.";
}

// ---------- Si ya hay sesión iniciada, redirigir ----------
auth.onAuthStateChanged(async (user) => {
  if (user && window.location.pathname.endsWith("index.html") || (user && window.location.pathname.endsWith("/"))) {
    const snapAdmin = await db.ref("admins/" + user.uid).get();
    if (snapAdmin.exists()) {
      window.location.href = "admin.html";
    } else {
      window.location.href = "reservar.html";
    }
  }
});
</script>
</body>
</html>
